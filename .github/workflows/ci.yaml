name: Verify packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: macos-15
            target: macos
          - os: windows-2022
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5
          cache: true
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed packages tool
      - run: dart test --coverage=coverage
        working-directory: packages/lsl
      - name: Check coverage of handwritten library code
        run: |
          dart run coverage:format_coverage --lcov --in packages/lsl/coverage --out packages/lsl/coverage/lcov.info --packages .dart_tool/package_config.json --report-on packages/lsl/lib
          dart run tool/check_coverage.dart
      - run: flutter test
        working-directory: packages/lsl_flutter
      - run: flutter test
        working-directory: packages/lsl_flutter/example
      - run: flutter build ${{ matrix.target }} --release
        working-directory: packages/lsl_flutter/example
      - run: dart build cli --target example/main.dart --output build/cli
        working-directory: packages/lsl
      - name: Run the bundled CLI
        if: runner.os != 'Windows'
        run: ./build/cli/bundle/bin/main
        working-directory: packages/lsl
      - name: Run the bundled CLI on Windows
        if: runner.os == 'Windows'
        run: ./build/cli/bundle/bin/main.exe
        working-directory: packages/lsl

  mobile-builds:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release
        working-directory: packages/lsl_flutter/example
      - run: flutter build ios --simulator --no-codesign
        working-directory: packages/lsl_flutter/example
      - run: flutter build ios --release --no-codesign
        working-directory: packages/lsl_flutter/example

  generated-bindings:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run packages/lsl/tool/ffigen.dart
      - run: git diff --exit-code -- packages/lsl/lib/src/third_party
