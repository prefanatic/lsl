name: Verify packages

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: macos-15
            target: macos
          - os: windows-2022
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        timeout-minutes: 5
        with:
          flutter-version: 3.47.5
          cache: true
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get --enforce-lockfile
        timeout-minutes: 3
      - run: dart analyze --fatal-infos
        timeout-minutes: 3
      - run: dart format --output=none --set-exit-if-changed packages tool test
        timeout-minutes: 1
      - run: dart test test/tool
        timeout-minutes: 2
      - run: dart test --coverage=coverage
        timeout-minutes: 5
        working-directory: packages/lsl
      - name: Check coverage of handwritten library code
        timeout-minutes: 2
        run: |
          dart run coverage:format_coverage --lcov --in packages/lsl/coverage --out packages/lsl/coverage/lcov.info --packages .dart_tool/package_config.json --report-on packages/lsl/lib
          dart run tool/check_coverage.dart
      - run: flutter test
        timeout-minutes: 5
        working-directory: packages/lsl_flutter
      - run: flutter test
        timeout-minutes: 5
        working-directory: packages/lsl_flutter/example
      - run: flutter build ${{ matrix.target }} --release
        timeout-minutes: 6
        working-directory: packages/lsl_flutter/example
      - run: dart build cli --target example/main.dart --output build/cli
        timeout-minutes: 4
        working-directory: packages/lsl
      - name: Run the bundled CLI
        if: runner.os != 'Windows'
        timeout-minutes: 1
        run: ./build/cli/bundle/bin/main
        working-directory: packages/lsl
      - name: Run the bundled CLI on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 1
        run: ./build/cli/bundle/bin/main.exe
        working-directory: packages/lsl

  mobile-builds:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        timeout-minutes: 5
        with:
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get --enforce-lockfile
        timeout-minutes: 3
      - run: flutter build apk --release
        timeout-minutes: 12
        working-directory: packages/lsl_flutter/example
      - run: flutter build ios --simulator --no-codesign
        timeout-minutes: 8
        working-directory: packages/lsl_flutter/example
      - run: flutter build ios --release --no-codesign
        timeout-minutes: 8
        working-directory: packages/lsl_flutter/example
      - name: Select an iOS simulator
        id: simulator
        timeout-minutes: 1
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device["name"].startswith("iPhone")))')
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Boot the iOS simulator
        timeout-minutes: 3
        env:
          LSL_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl boot "$LSL_SIMULATOR_ID"
          xcrun simctl bootstatus "$LSL_SIMULATOR_ID" -b
      - name: Test transport on an iOS simulator
        timeout-minutes: 8
        working-directory: packages/lsl_flutter/example
        env:
          LSL_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: flutter test --no-pub --verbose --reporter expanded --timeout 2m integration_test/transport_test.dart -d "$LSL_SIMULATOR_ID"
      - name: Shut down the iOS simulator
        if: ${{ always() && steps.simulator.outputs.id != '' }}
        timeout-minutes: 1
        env:
          LSL_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: xcrun simctl shutdown "$LSL_SIMULATOR_ID"

  generated-bindings:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        timeout-minutes: 5
        with:
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get --enforce-lockfile
        timeout-minutes: 3
      - run: dart run packages/lsl/tool/ffigen.dart
        timeout-minutes: 3
      - run: git diff --exit-code -- packages/lsl/lib/src/third_party
        timeout-minutes: 1
      - run: dart doc --validate-links --output build/api
        timeout-minutes: 2
        working-directory: packages/lsl
      - run: dart doc --validate-links --output build/api
        timeout-minutes: 2
        working-directory: packages/lsl_flutter
